<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>We'll be back soon | Setpiece</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #013662;
        color: #fff;
        font:
          18px Calibri,
          Arial,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 640px);
        text-align: center;
        padding: 48px 28px;
        border-radius: 40px;
        background: #012b4f;
      }
      img {
        max-width: 220px;
        background: #fff;
        border-radius: 6px;
        padding: 8px;
      }
      p {
        color: #dce8ee;
        line-height: 1.55;
      }
      .tag {
        color: #1ecbd4;
        font-weight: bold;
        font-size: 20px;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 28px;
      }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 0 22px;
        background: #1ecbd4;
        color: #013662;
        font-weight: bold;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/setpiece-logo.png" alt="Setpiece" />
      <p class="tag">Your Healthcare Partner</p>
      <h1>We’ll be back soon.</h1>
      <p>
        Setpiece is briefly unavailable while we carry out maintenance. Please
        try again shortly.
      </p>
      <div class="actions">
        <a href="mailto:admin@setpiecegh.com">Email us</a>
      </div>
    </main>
  </body>
</html>
